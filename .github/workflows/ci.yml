name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'BTE gate for the fixture evaluation step: fail | unknown | pending'
        default: fail
        type: choice
        options: [fail, unknown, pending]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BTE_FAIL_ON: ${{ github.event.inputs.fail_on || 'fail' }}

jobs:
  quality:
    name: Lint, typecheck, format, boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware lint resolves workspace packages through their built dist/*.d.ts; build first.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  test:
    name: Unit, CLI, demo scenarios (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bte
          POSTGRES_PASSWORD: bte
          POSTGRES_DB: bte
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bte -d bte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BTE_TEST_POSTGRES_URL: postgres://bte:bte@127.0.0.1:5432/bte
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Unit, integration and property tests with coverage thresholds
        run: pnpm test:coverage
        env:
          CI: 'true'
      - name: CLI contract (fixtures, exit codes, reproducibility)
        run: pnpm check:cli
      - name: Demo scenarios -> NDJSON -> CLI (every seeded fault yields its catalogued verdict)
        run: pnpm check:scenarios
      - name: Gate the fixture catalogue with the selected --fail-on and publish a step summary
        run: |
          set +e
          node apps/cli/dist/main.js evaluate --rules rules --evidence examples/fixtures/normal.ndjson examples/fixtures/duplicate-delivery.ndjson \
            --now 2026-01-15T10:03:00Z --fail-on "$BTE_FAIL_ON" --format json --output bte-report/gate.json \
            --junit bte-report/gate.junit.xml --markdown bte-report/gate.md
          code=$?
          set -e
          cat bte-report/gate.md >> "$GITHUB_STEP_SUMMARY"
          echo "bte evaluate exit code: $code (0 = gate passed, 1 = gate failed, 2 = could not evaluate)"
          test "$code" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bte-report-node${{ matrix.node }}
          path: |
            bte-report/**/*.json
            bte-report/**/*.xml
            bte-report/**/*.md
            bte-report/**/*.ndjson
            bte-report/coverage/lcov.info
          if-no-files-found: ignore

  e2e:
    name: Playwright (checkout UI vs. business truth)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @bte/e2e exec playwright install --with-deps chromium --only-shell
      - name: Gated suite (UI, API, business-truth matrix)
        run: pnpm test:e2e
      - name: Demonstration (UI test must pass, BTE test must fail with MISSING_EXPECTED_OUTCOME)
        run: |
          pnpm check:demonstration | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            bte-report/e2e-html
            bte-report/e2e-junit.xml
            bte-report/e2e-results/**/trace.zip
            bte-report/e2e-results/**/*.png
          if-no-files-found: ignore

  consumer:
    name: Independent consumer (learning platform) from packed tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack every public package
        run: pnpm pack:packages
      - name: Install the consumer from tarballs only (no workspace links)
        working-directory: examples/learning-platform
        run: |
          npm install --no-audit --no-fund
          test -z "$(grep -l 'workspace:' node_modules/@bte/*/package.json || true)"
          node -e "console.log(require.resolve('@bte/sdk'))" | grep -q node_modules/@bte/sdk/dist
          npx tsc -p tsconfig.json
      - name: Install Playwright browser for the consumer
        working-directory: examples/learning-platform
        run: npx playwright install --with-deps chromium --only-shell
      - name: Consumer Playwright tests (PASS / FAIL / PENDING / UNKNOWN + CLI)
        working-directory: examples/learning-platform
        run: npx playwright test
      - name: Consumer CLI smoke (rules validate from the installed bin)
        working-directory: examples/learning-platform
        run: npx bte rules validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-report
          path: |
            examples/learning-platform/playwright-report
            examples/learning-platform/bte-report
          if-no-files-found: ignore

  consumer-orangehrm:
    name: OrangeHRM consumer (contract + offline; demo when secrets are set)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    env:
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:packages
      - working-directory: examples/orangehrm
        run: |
          npm install --no-audit --no-fund
          npx tsc -p tsconfig.json
          npx bte rules validate
      - working-directory: examples/orangehrm
        run: npx playwright install --with-deps chromium --only-shell
      - name: Contract and offline projects (no network, no credentials)
        working-directory: examples/orangehrm
        run: npx playwright test --project=contract --project=offline
      - name: Public demo, read-only (only when credentials are configured as repository secrets)
        # The secrets context is not available in step conditions; it is mapped through job env below.
        if: env.ORANGEHRM_USERNAME != ''
        working-directory: examples/orangehrm
        env:
          ORANGEHRM_API_MODE: session
        run: npx playwright test --project=setup --project=demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orangehrm-consumer-report
          path: examples/orangehrm/playwright-report
          if-no-files-found: ignore
