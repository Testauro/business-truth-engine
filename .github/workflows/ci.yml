name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, evaluate fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
        env:
          CI: 'true'
      - name: Evaluate fixtures with the built CLI (expect FAIL exit code on seeded defect)
        run: |
          node apps/cli/dist/main.js validate --rules rules
          node apps/cli/dist/main.js evaluate --rules rules --evidence examples/fixtures/normal.ndjson --now 2026-01-15T10:03:00Z --format json --output bte-report/normal.json
          if node apps/cli/dist/main.js evaluate --rules rules --evidence examples/fixtures/duplicate-invoice.ndjson --now 2026-01-15T10:03:00Z --format json --output bte-report/duplicate-invoice.json; then
            echo "expected a FAIL exit code for the duplicate-invoice fixture" >&2; exit 1
          fi
      - name: Demo scenarios -> NDJSON -> CLI (every seeded fault must yield its catalogued verdict)
        run: |
          set -e
          mkdir -p bte-report/demo
          check() { # fault expected-summary
            if [ "$1" = none ]; then args=(); else args=(--fault "$1"); fi
            node apps/demo/dist/scenario.js "${args[@]}" --out "bte-report/demo/$1.ndjson" > "bte-report/demo/$1.meta.json"
            summary=$(node apps/cli/dist/main.js evaluate --rules rules --evidence "bte-report/demo/$1.ndjson" --now 2026-01-15T10:02:31Z --format json --output "bte-report/demo/$1.json" >/dev/null 2>&1; node -e "const r=require('./bte-report/demo/$1.json');console.log(Object.entries(r.summary).filter(([,n])=>n>0).map(([k,n])=>k+'='+n).join(','))")
            echo "$1 -> $summary"
            [ "$summary" = "$2" ] || { echo "expected $2" >&2; exit 1; }
          }
          check none PASS=1
          check missing-invoice FAIL=1
          check duplicate-invoice FAIL=1
          check wrong-amount FAIL=1
          check delayed-invoice FAIL=1
          check invoicing-unavailable UNKNOWN=1
          check duplicate-delivery PASS=1
      - name: Install Playwright browser
        run: pnpm --filter @bte/e2e exec playwright install --with-deps chromium --only-shell
      - name: Playwright gated suite
        run: pnpm test:e2e
      - name: Playwright demonstration (UI passes, BTE fails by design; must exit non-zero)
        run: |
          if pnpm test:e2e:demonstration; then
            echo "demonstration unexpectedly passed: BTE did not flag the missing invoice" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bte-report
          path: bte-report/
          if-no-files-found: ignore
